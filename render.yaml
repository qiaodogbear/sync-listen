services:
  - type: web
    name: sync-listen
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/sync-listen
    branch: feat/mvp
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      - key: DATABASE_PATH
        value: /data/sync-listen.sqlite
      - key: AUDIO_STORAGE_PATH
        value: /data/audio
      - key: TEMP_UPLOAD_PATH
        value: /data/tmp
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
